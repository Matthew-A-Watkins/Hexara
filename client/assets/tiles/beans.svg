<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bFelt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a54"/>
      <stop offset="1" stop-color="#0d4f2f"/>
    </linearGradient>
    <radialGradient id="bSpot" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2ea36a"/>
      <stop offset="1" stop-color="#2ea36a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bBean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c75a"/>
      <stop offset="1" stop-color="#b07a2a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bFelt)"/>
  <ellipse cx="100" cy="84" rx="120" ry="90" fill="url(#bSpot)"/>
  <!-- casino chips at the back -->
  <g stroke="#0c0805" stroke-width="2">
    <ellipse cx="150" cy="150" rx="22" ry="9" fill="#0a0805" stroke="none" opacity="0.35"/>
    <ellipse cx="152" cy="140" rx="18" ry="7" fill="#c0392b"/>
    <ellipse cx="152" cy="132" rx="18" ry="7" fill="#2c5f9e"/>
    <ellipse cx="152" cy="124" rx="18" ry="7" fill="#e8e4d8"/>
    <ellipse cx="152" cy="124" rx="10" ry="3.6" fill="none" stroke="#b0a99a" stroke-width="1.4"/>
  </g>
  <!-- a pile of beans -->
  <g stroke="#7a4f15" stroke-width="1.5">
    <ellipse cx="84" cy="166" rx="44" ry="14" fill="#0a0805" stroke="none" opacity="0.3"/>
    <g fill="url(#bBean)">
      <path d="M48 162 q-9 -10 4 -16 q14 -6 18 5 q4 12 -10 14 q-9 1 -12 -3 Z"/>
      <path d="M74 168 q-9 -10 4 -16 q14 -6 18 5 q4 12 -10 14 q-9 1 -12 -3 Z"/>
      <path d="M100 164 q-9 -10 4 -16 q14 -6 18 5 q4 12 -10 14 q-9 1 -12 -3 Z"/>
      <path d="M62 150 q-8 -9 4 -14 q12 -5 16 4 q4 11 -9 13 q-8 1 -11 -3 Z"/>
      <path d="M88 150 q-8 -9 4 -14 q12 -5 16 4 q4 11 -9 13 q-8 1 -11 -3 Z"/>
    </g>
    <!-- bean seams -->
    <g fill="none" stroke="#8a5e1c" stroke-width="1.3" opacity="0.8">
      <path d="M52 155 q8 -3 14 2"/>
      <path d="M78 161 q8 -3 14 2"/>
      <path d="M104 157 q8 -3 14 2"/>
    </g>
  </g>
  <!-- felt sparkle -->
  <g fill="#bff0d4" opacity="0.7">
    <path d="M150 62 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2 Z"/>
  </g>
</svg>
