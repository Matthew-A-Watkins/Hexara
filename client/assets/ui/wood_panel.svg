<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="plank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5429"/>
      <stop offset="0.5" stop-color="#7a4a23"/>
      <stop offset="1" stop-color="#6a3f1d"/>
    </linearGradient>
    <!-- one tileable vertical plank, 64 wide x 256 tall -->
    <g id="woodPlank">
      <rect width="64" height="256" fill="url(#plank)"/>
      <!-- grain streaks: full-height with matching top/bottom x so they tile -->
      <g stroke-linecap="round" fill="none">
        <path d="M14 0 C19 64 9 150 14 256" stroke="#6a3d1c" stroke-width="2" opacity="0.4"/>
        <path d="M30 0 C25 80 35 170 30 256" stroke="#8f5b2f" stroke-width="1.6" opacity="0.4"/>
        <path d="M46 0 C51 90 41 180 46 256" stroke="#653a1a" stroke-width="2.2" opacity="0.38"/>
        <path d="M22 0 C25 110 19 200 22 256" stroke="#94612f" stroke-width="1" opacity="0.35"/>
        <path d="M54 0 C51 70 57 160 54 256" stroke="#6e431f" stroke-width="1.2" opacity="0.35"/>
      </g>
      <!-- knot -->
      <ellipse cx="38" cy="96" rx="4" ry="6" fill="#5a3417" opacity="0.55"/>
      <ellipse cx="38" cy="96" rx="1.8" ry="3" fill="#4a2a12" opacity="0.6"/>
      <!-- groove on the right edge of the plank (dark gap) + left-edge highlight -->
      <rect x="62.4" y="0" width="1.6" height="256" fill="#3a2110" opacity="0.75"/>
      <rect x="0.6" y="0" width="1.2" height="256" fill="#9a6638" opacity="0.45"/>
    </g>
  </defs>

  <rect width="256" height="256" fill="#7a4a23"/>
  <use href="#woodPlank" x="0"/>
  <use href="#woodPlank" x="64"/>
  <use href="#woodPlank" x="128"/>
  <use href="#woodPlank" x="192"/>

  <!-- soft top-left sheen across whole panel -->
  <rect width="256" height="256" fill="#ffffff" opacity="0.04"/>
</svg>
