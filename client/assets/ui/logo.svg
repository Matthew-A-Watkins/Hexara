<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130">
  <defs>
    <linearGradient id="lgGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="0.5" stop-color="#e3b23c"/>
      <stop offset="1" stop-color="#b9831f"/>
    </linearGradient>
    <linearGradient id="lgSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6c8f"/>
      <stop offset="1" stop-color="#1d4f6b"/>
    </linearGradient>
    <radialGradient id="lgGlow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#f3e6c8"/>
      <stop offset="1" stop-color="#e7d4a8"/>
    </radialGradient>
  </defs>

  <!-- parchment plaque -->
  <rect x="6" y="6" width="408" height="118" rx="16" fill="url(#lgGlow)" stroke="#7a4a23" stroke-width="3"/>
  <rect x="13" y="13" width="394" height="104" rx="11" fill="none" stroke="#b9831f" stroke-width="1.5" opacity="0.8"/>

  <!-- compass rose, left -->
  <g transform="translate(46 50)">
    <circle r="22" fill="url(#lgSea)" stroke="#1d4f6b" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#f3e6c8" stroke-width="1" opacity="0.5"/>
    <g stroke="#f3e6c8" stroke-width="0.8" opacity="0.6">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
    </g>
    <path d="M0 -18 L4 0 L0 4 L-4 0 Z" fill="#f3d27a" stroke="#b9831f" stroke-width="0.6"/>
    <path d="M0 18 L4 0 L0 -4 L-4 0 Z" fill="#cfe3ee" stroke="#1d4f6b" stroke-width="0.6"/>
    <path d="M-18 0 L0 4 L4 0 L0 -4 Z" fill="#e7d4a8" stroke="#b9831f" stroke-width="0.6"/>
    <path d="M18 0 L0 4 L-4 0 L0 -4 Z" fill="#9cc0d4" stroke="#1d4f6b" stroke-width="0.6"/>
    <circle r="2.4" fill="#3a2a18"/>
  </g>

  <!-- title -->
  <text x="232" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="bold"
        letter-spacing="3" text-anchor="middle" fill="url(#lgGold)" stroke="#7a4a23" stroke-width="1.4"
        paint-order="stroke">HEXARA</text>

  <!-- subtitle ribbon -->
  <g transform="translate(232 92)">
    <rect x="-104" y="-13" width="208" height="26" rx="13" fill="url(#lgSea)" stroke="#1d4f6b" stroke-width="1.6"/>
    <text x="0" y="6" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold"
          letter-spacing="6" text-anchor="middle" fill="#f3e6c8">ISLAND SETTLERS</text>
  </g>

  <!-- waves bottom-right accent -->
  <g transform="translate(360 96)" stroke="#2b6c8f" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M-18 0 q4.5 -6 9 0 t9 0"/>
    <path d="M-18 8 q4.5 -6 9 0 t9 0"/>
  </g>
</svg>
