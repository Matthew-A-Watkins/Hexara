<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="wf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4caf50"/>
      <stop offset="1" stop-color="#205723"/>
    </linearGradient>
    <linearGradient id="wp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efd6"/>
      <stop offset="1" stop-color="#ead9b3"/>
    </linearGradient>
    <radialGradient id="wlog" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d49a5e"/>
      <stop offset="0.55" stop-color="#a86a32"/>
      <stop offset="1" stop-color="#6e4220"/>
    </radialGradient>
    <linearGradient id="wbark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a2e"/>
      <stop offset="1" stop-color="#5e3a1c"/>
    </linearGradient>
    <filter id="ws" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.7" dy="1.6" stdDeviation="1.4" flood-color="#2a1c0e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#3a2a18"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#wf)"/>
  <rect x="12" y="12" width="96" height="144" rx="8" fill="#3a2a18" opacity="0.35"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="url(#wp)"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="none" stroke="#1f5a23" stroke-width="1.4" opacity="0.5"/>
  <g filter="url(#ws)">
    <!-- stacked log timber -->
    <g transform="translate(60 78)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#5e3a1c" opacity="0.25" transform="translate(0 22)"/>
      <!-- back log -->
      <rect x="-40" y="-26" width="80" height="26" rx="13" fill="url(#wbark)"/>
      <ellipse cx="-40" cy="-13" rx="9" ry="13" fill="url(#wlog)" stroke="#5e3a1c" stroke-width="1.5"/>
      <ellipse cx="-40" cy="-13" rx="5.5" ry="8" fill="none" stroke="#7a4a23" stroke-width="1.1" opacity="0.7"/>
      <ellipse cx="-40" cy="-13" rx="2.4" ry="3.4" fill="#7a4a23"/>
      <!-- front log -->
      <rect x="-34" y="-2" width="80" height="28" rx="14" fill="url(#wbark)"/>
      <ellipse cx="46" cy="12" rx="10" ry="14" fill="url(#wlog)" stroke="#5e3a1c" stroke-width="1.6"/>
      <ellipse cx="46" cy="12" rx="6.2" ry="9" fill="none" stroke="#7a4a23" stroke-width="1.2" opacity="0.7"/>
      <ellipse cx="46" cy="12" rx="3.4" ry="4.8" fill="none" stroke="#7a4a23" stroke-width="1" opacity="0.7"/>
      <ellipse cx="46" cy="12" rx="1.3" ry="1.9" fill="#7a4a23"/>
      <!-- bark highlight -->
      <rect x="-30" y="1" width="70" height="4" rx="2" fill="#a86a32" opacity="0.55"/>
    </g>
  </g>
  <rect x="22" y="130" width="76" height="20" rx="6" fill="#1f5a23"/>
  <rect x="22" y="130" width="76" height="20" rx="6" fill="none" stroke="#143d18" stroke-width="1"/>
  <text x="60" y="144.5" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#f3e6c8">LUMBER</text>
</svg>
