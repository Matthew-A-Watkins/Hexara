<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="dbf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a55c0"/>
      <stop offset="1" stop-color="#2a1f5e"/>
    </linearGradient>
    <radialGradient id="dbfield" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#3b2d72"/>
      <stop offset="1" stop-color="#221a47"/>
    </radialGradient>
    <linearGradient id="dbgold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbe79a"/>
      <stop offset="0.5" stop-color="#e3b23c"/>
      <stop offset="1" stop-color="#a9801f"/>
    </linearGradient>
    <radialGradient id="dbhex" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#f4d877"/>
      <stop offset="1" stop-color="#b8902e"/>
    </radialGradient>
    <filter id="dbs" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#140d2c" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#241a4a"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#dbf)"/>
  <rect x="10" y="10" width="100" height="148" rx="9" fill="url(#dbfield)"/>
  <!-- ornate gold double border -->
  <rect x="10" y="10" width="100" height="148" rx="9" fill="none" stroke="url(#dbgold)" stroke-width="2"/>
  <rect x="15" y="15" width="90" height="138" rx="7" fill="none" stroke="url(#dbgold)" stroke-width="1" opacity="0.7"/>
  <!-- corner flourishes -->
  <g fill="none" stroke="url(#dbgold)" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <path d="M20,26 C26,26 26,20 26,20"/>
    <path d="M100,26 C94,26 94,20 94,20"/>
    <path d="M20,142 C26,142 26,148 26,148"/>
    <path d="M100,142 C94,142 94,148 94,148"/>
  </g>
  <g fill="url(#dbgold)" opacity="0.9">
    <circle cx="20" cy="20" r="2.2"/><circle cx="100" cy="20" r="2.2"/>
    <circle cx="20" cy="148" r="2.2"/><circle cx="100" cy="148" r="2.2"/>
  </g>
  <!-- diamond lattice background pattern -->
  <g stroke="#5544a0" stroke-width="0.8" opacity="0.4">
    <path d="M30,50 L60,38 L90,50 M30,70 L60,58 L90,70 M30,118 L60,130 L90,118 M30,98 L60,110 L90,98"/>
    <path d="M30,50 L60,62 L90,50 M30,118 L60,106 L90,118"/>
  </g>
  <!-- central radiant medallion -->
  <g transform="translate(60 84)">
    <g opacity="0.45" fill="url(#dbgold)">
      <path d="M0,-40 L3,-26 L-3,-26 Z"/>
      <path d="M0,-40 L3,-26 L-3,-26 Z" transform="rotate(60)"/>
      <path d="M0,-40 L3,-26 L-3,-26 Z" transform="rotate(120)"/>
      <path d="M0,-40 L3,-26 L-3,-26 Z" transform="rotate(180)"/>
      <path d="M0,-40 L3,-26 L-3,-26 Z" transform="rotate(240)"/>
      <path d="M0,-40 L3,-26 L-3,-26 Z" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#dbgold)" stroke-width="1" opacity="0.6"/>
    <g filter="url(#dbs)">
      <!-- HEXARA hex emblem -->
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13"
               fill="url(#dbhex)" stroke="#8c6a1e" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13"
               fill="none" stroke="#fff0bf" stroke-width="0.8" opacity="0.5" transform="scale(0.82)"/>
      <!-- inner hex relief -->
      <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="#2a1f5e"/>
      <!-- stylised H monogram -->
      <g fill="url(#dbhex)">
        <rect x="-7" y="-9" width="3.6" height="18" rx="1"/>
        <rect x="3.4" y="-9" width="3.6" height="18" rx="1"/>
        <rect x="-7" y="-2" width="14" height="3.4"/>
      </g>
      <!-- top-left sheen on hex -->
      <polygon points="0,-26 22.5,-13 11,-9 0,-17" fill="#fff0bf" opacity="0.4"/>
    </g>
  </g>
  <!-- small bottom flourish -->
  <g transform="translate(60 140)" fill="url(#dbgold)" opacity="0.85">
    <circle cx="0" cy="0" r="2.4"/>
    <path d="M-16,0 Q-8,-5 0,0 Q8,-5 16,0 Q8,5 0,0 Q-8,5 -16,0 Z" stroke="url(#dbgold)" stroke-width="0.8" fill="none"/>
  </g>
</svg>
