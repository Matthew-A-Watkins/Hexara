<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="yf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a55c0"/>
      <stop offset="1" stop-color="#2a1f5e"/>
    </linearGradient>
    <linearGradient id="yp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#d4cfe2"/>
    </linearGradient>
    <linearGradient id="ygold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d877"/>
      <stop offset="1" stop-color="#b8902e"/>
    </linearGradient>
    <linearGradient id="yhorn" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e0b86a"/>
      <stop offset="0.55" stop-color="#b3863a"/>
      <stop offset="1" stop-color="#7a5824"/>
    </linearGradient>
    <filter id="ys" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.7" dy="1.6" stdDeviation="1.4" flood-color="#1a1230" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#241a4a"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#yf)"/>
  <rect x="9" y="9" width="102" height="150" rx="10" fill="none" stroke="url(#ygold)" stroke-width="1.3" opacity="0.85"/>
  <rect x="12" y="12" width="96" height="144" rx="8" fill="#1a1230" opacity="0.35"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="url(#yp)"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="none" stroke="#3a2f6e" stroke-width="1.2" opacity="0.45"/>
  <g filter="url(#ys)">
    <g transform="translate(60 78)">
      <ellipse cx="0" cy="42" rx="34" ry="6" fill="#1a1230" opacity="0.2"/>
      <!-- cornucopia horn, curling to lower-left -->
      <path d="M30,-28 C8,-34 -16,-28 -30,-8 C-40,6 -34,24 -18,28 C-26,16 -20,4 -6,0 C8,-4 20,-2 34,-6 C40,-16 38,-24 30,-28 Z"
            fill="url(#yhorn)" stroke="#6a4c1f" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- horn ridges -->
      <g stroke="#7a5824" stroke-width="1" opacity="0.5" fill="none">
        <path d="M-28,-2 C-36,10 -30,22 -20,26"/>
        <path d="M-18,-10 C-26,2 -22,16 -12,22"/>
      </g>
      <!-- mouth rim -->
      <ellipse cx="28" cy="-16" rx="13" ry="16" fill="#8a6628" stroke="#6a4c1f" stroke-width="1.6" transform="rotate(20 28 -16)"/>
      <ellipse cx="28" cy="-16" rx="9" ry="12" fill="#5e4419" transform="rotate(20 28 -16)"/>
      <!-- spilling bounty -->
      <g stroke="#7a5512" stroke-width="0.8">
        <circle cx="22" cy="-26" r="8" fill="#c1572e"/>            <!-- apple -->
        <ellipse cx="36" cy="-22" rx="6" ry="9" fill="#e3b23c" transform="rotate(20 36 -22)"/> <!-- gourd -->
        <ellipse cx="30" cy="-6" rx="9" ry="6" fill="#9c4a1f"/>     <!-- yam -->
        <circle cx="40" cy="-8" r="6" fill="#5f9e30"/>              <!-- green -->
        <ellipse cx="18" cy="-12" rx="5" ry="7" fill="#e07a4d" transform="rotate(-15 18 -12)"/>
        <circle cx="46" cy="-18" r="4.5" fill="#aadb6a"/>
      </g>
      <!-- grape cluster -->
      <g fill="#6a4ba0" stroke="#46306e" stroke-width="0.5">
        <circle cx="14" cy="-30" r="3"/><circle cx="20" cy="-33" r="3"/>
        <circle cx="17" cy="-36" r="3"/><circle cx="23" cy="-29" r="3"/>
      </g>
      <!-- wheat sprig -->
      <g stroke="#9a6c18" stroke-width="1.4" fill="#e3b23c">
        <line x1="44" y1="-26" x2="52" y2="-42"/>
        <ellipse cx="52" cy="-44" rx="2.4" ry="5" stroke="none"/>
        <ellipse cx="48" cy="-39" rx="2" ry="4" stroke="none" transform="rotate(-30 48 -39)"/>
        <ellipse cx="56" cy="-39" rx="2" ry="4" stroke="none" transform="rotate(30 56 -39)"/>
      </g>
      <!-- highlight on apple -->
      <circle cx="19" cy="-29" r="2.2" fill="#f0a079" opacity="0.8"/>
    </g>
  </g>
  <rect x="12" y="132" width="96" height="20" rx="6" fill="url(#ygold)"/>
  <rect x="12" y="132" width="96" height="20" rx="6" fill="none" stroke="#8c6a1e" stroke-width="1"/>
  <text x="60" y="146.3" font-family="Georgia, serif" font-size="10.5" font-weight="bold" letter-spacing="0.6" text-anchor="middle" fill="#2a1f5e">YEAR OF PLENTY</text>
</svg>
