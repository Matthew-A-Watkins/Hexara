<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="kf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a55c0"/>
      <stop offset="1" stop-color="#2a1f5e"/>
    </linearGradient>
    <linearGradient id="kp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#d4cfe2"/>
    </linearGradient>
    <linearGradient id="khelm" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d9dde6"/>
      <stop offset="0.5" stop-color="#9aa3b3"/>
      <stop offset="1" stop-color="#5a6473"/>
    </linearGradient>
    <linearGradient id="kgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d877"/>
      <stop offset="1" stop-color="#b8902e"/>
    </linearGradient>
    <filter id="ks" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.7" dy="1.6" stdDeviation="1.4" flood-color="#1a1230" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#241a4a"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#kf)"/>
  <rect x="9" y="9" width="102" height="150" rx="10" fill="none" stroke="url(#kgold)" stroke-width="1.3" opacity="0.85"/>
  <rect x="12" y="12" width="96" height="144" rx="8" fill="#1a1230" opacity="0.35"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="url(#kp)"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="none" stroke="#3a2f6e" stroke-width="1.2" opacity="0.45"/>
  <g filter="url(#ks)">
    <g transform="translate(60 76)">
      <ellipse cx="0" cy="40" rx="28" ry="6" fill="#1a1230" opacity="0.2"/>
      <!-- plume -->
      <path d="M2,-44 C18,-50 26,-36 18,-22 C14,-30 8,-32 2,-30 Z" fill="url(#kgold)" stroke="#9a7420" stroke-width="0.8"/>
      <!-- great helm -->
      <path d="M-22,-20 C-22,-34 -10,-40 0,-40 C10,-40 22,-34 22,-20 L22,18 C22,30 12,40 0,40 C-12,40 -22,30 -22,18 Z"
            fill="url(#khelm)" stroke="#454e5d" stroke-width="1.8"/>
      <!-- crest ridge -->
      <path d="M0,-40 L0,40" stroke="#6b7585" stroke-width="2" opacity="0.5"/>
      <!-- visor slit -->
      <rect x="-18" y="-10" width="36" height="6" rx="3" fill="#2a2f3a"/>
      <rect x="-18" y="2" width="36" height="4" rx="2" fill="#2a2f3a"/>
      <!-- breath holes -->
      <g fill="#2a2f3a">
        <circle cx="-10" cy="14" r="1.6"/><circle cx="-2" cy="16" r="1.6"/>
        <circle cx="6" cy="16" r="1.6"/><circle cx="13" cy="14" r="1.6"/>
      </g>
      <!-- left lit edge -->
      <path d="M-22,-20 C-22,-34 -10,-40 0,-40 L0,-34 C-8,-34 -16,-30 -16,-18 L-16,18 C-16,26 -10,32 -2,33 L-2,39 C-12,38 -22,29 -22,18 Z" fill="#e7eaf0" opacity="0.45"/>
    </g>
  </g>
  <rect x="30" y="132" width="60" height="20" rx="6" fill="url(#kgold)"/>
  <rect x="30" y="132" width="60" height="20" rx="6" fill="none" stroke="#8c6a1e" stroke-width="1"/>
  <text x="60" y="146.5" font-family="Georgia, serif" font-size="12.5" font-weight="bold" letter-spacing="1.5" text-anchor="middle" fill="#2a1f5e">KNIGHT</text>
</svg>
