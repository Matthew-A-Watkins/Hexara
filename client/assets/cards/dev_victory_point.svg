<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="vf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a55c0"/>
      <stop offset="1" stop-color="#2a1f5e"/>
    </linearGradient>
    <linearGradient id="vp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#d4cfe2"/>
    </linearGradient>
    <linearGradient id="vgold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbe79a"/>
      <stop offset="0.5" stop-color="#e3b23c"/>
      <stop offset="1" stop-color="#a9801f"/>
    </linearGradient>
    <radialGradient id="vgem" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ff8f9f"/>
      <stop offset="1" stop-color="#b02038"/>
    </radialGradient>
    <filter id="vs" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.7" dy="1.6" stdDeviation="1.4" flood-color="#1a1230" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#241a4a"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#vf)"/>
  <rect x="9" y="9" width="102" height="150" rx="10" fill="none" stroke="url(#vgold)" stroke-width="1.3" opacity="0.85"/>
  <rect x="12" y="12" width="96" height="144" rx="8" fill="#1a1230" opacity="0.35"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="url(#vp)"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="none" stroke="#3a2f6e" stroke-width="1.2" opacity="0.45"/>
  <!-- radiant burst behind crown -->
  <g transform="translate(60 74)" opacity="0.5">
    <g fill="#f4d877">
      <path d="M0,-46 L4,-30 L-4,-30 Z"/>
      <path d="M0,-46 L4,-30 L-4,-30 Z" transform="rotate(40)"/>
      <path d="M0,-46 L4,-30 L-4,-30 Z" transform="rotate(-40)"/>
      <path d="M0,-46 L4,-30 L-4,-30 Z" transform="rotate(80)"/>
      <path d="M0,-46 L4,-30 L-4,-30 Z" transform="rotate(-80)"/>
    </g>
  </g>
  <g filter="url(#vs)">
    <g transform="translate(60 74)">
      <ellipse cx="0" cy="44" rx="30" ry="6" fill="#1a1230" opacity="0.2"/>
      <!-- crown base band -->
      <rect x="-30" y="24" width="60" height="18" rx="4" fill="url(#vgold)" stroke="#8c6a1e" stroke-width="1.4"/>
      <!-- crown points -->
      <path d="M-30,26 L-30,-4 L-16,16 L0,-14 L16,16 L30,-4 L30,26 Z"
            fill="url(#vgold)" stroke="#8c6a1e" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- point jewels -->
      <circle cx="-30" cy="-6" r="3.4" fill="url(#vgem)" stroke="#8c6a1e" stroke-width="0.7"/>
      <circle cx="0" cy="-16" r="3.8" fill="url(#vgem)" stroke="#8c6a1e" stroke-width="0.7"/>
      <circle cx="30" cy="-6" r="3.4" fill="url(#vgem)" stroke="#8c6a1e" stroke-width="0.7"/>
      <!-- band gems -->
      <circle cx="-16" cy="33" r="3.6" fill="url(#vgem)" stroke="#8c6a1e" stroke-width="0.7"/>
      <circle cx="0" cy="33" r="4.2" fill="url(#vgem)" stroke="#8c6a1e" stroke-width="0.8"/>
      <circle cx="16" cy="33" r="3.6" fill="url(#vgem)" stroke="#8c6a1e" stroke-width="0.7"/>
      <!-- gem highlights -->
      <circle cx="-1.2" cy="31.6" r="1.2" fill="#ffd0d8"/>
      <circle cx="-1" cy="-17.2" r="1.1" fill="#ffd0d8"/>
      <!-- band highlight -->
      <rect x="-28" y="26" width="56" height="3.5" rx="1.5" fill="#fff0bf" opacity="0.6"/>
    </g>
  </g>
  <rect x="14" y="132" width="92" height="20" rx="6" fill="url(#vgold)"/>
  <rect x="14" y="132" width="92" height="20" rx="6" fill="none" stroke="#8c6a1e" stroke-width="1"/>
  <text x="60" y="146.3" font-family="Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#2a1f5e">VICTORY POINT</text>
</svg>
