<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="bf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e07a4d"/>
      <stop offset="1" stop-color="#8f3a1c"/>
    </linearGradient>
    <linearGradient id="bp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efd6"/>
      <stop offset="1" stop-color="#ead9b3"/>
    </linearGradient>
    <linearGradient id="bbrick" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d9683c"/>
      <stop offset="0.55" stop-color="#c1572e"/>
      <stop offset="1" stop-color="#8f3a1c"/>
    </linearGradient>
    <filter id="bs" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.7" dy="1.6" stdDeviation="1.4" flood-color="#2a1c0e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#3a2a18"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#bf)"/>
  <rect x="12" y="12" width="96" height="144" rx="8" fill="#3a2a18" opacity="0.35"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="url(#bp)"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="none" stroke="#8f3a1c" stroke-width="1.4" opacity="0.5"/>
  <g filter="url(#bs)">
    <g transform="translate(60 80) rotate(-12)">
      <!-- 3D clay brick: top + front + side -->
      <polygon points="-38,-8 12,-26 50,-12 0,6" fill="#e6855a"/>
      <polygon points="0,6 50,-12 50,18 0,36" fill="#a8481f"/>
      <polygon points="-38,-8 0,6 0,36 -38,22" fill="url(#bbrick)"/>
      <!-- mortar score lines on front face -->
      <line x1="-30" y1="6.5" x2="-30" y2="36" stroke="#7a2f14" stroke-width="1.2" opacity="0.55"/>
      <line x1="-19" y1="11" x2="-19" y2="40" stroke="#7a2f14" stroke-width="1.2" opacity="0.45"/>
      <!-- top highlight -->
      <polygon points="-38,-8 12,-26 24,-22 -26,-4" fill="#f0a079" opacity="0.6"/>
    </g>
  </g>
  <rect x="28" y="130" width="64" height="20" rx="6" fill="#8f3a1c"/>
  <rect x="28" y="130" width="64" height="20" rx="6" fill="none" stroke="#5e2410" stroke-width="1"/>
  <text x="60" y="144.5" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#f3e6c8">BRICK</text>
</svg>
