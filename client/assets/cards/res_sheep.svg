<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="sf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aadb6a"/>
      <stop offset="1" stop-color="#5f9e30"/>
    </linearGradient>
    <linearGradient id="sp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efd6"/>
      <stop offset="1" stop-color="#ead9b3"/>
    </linearGradient>
    <radialGradient id="swool" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f2ead8"/>
      <stop offset="1" stop-color="#d8ccb0"/>
    </radialGradient>
    <linearGradient id="sface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6f78"/>
      <stop offset="1" stop-color="#3f434b"/>
    </linearGradient>
    <filter id="ss" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.7" dy="1.6" stdDeviation="1.4" flood-color="#2a1c0e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#3a2a18"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#sf)"/>
  <rect x="12" y="12" width="96" height="144" rx="8" fill="#3a2a18" opacity="0.35"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="url(#sp)"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="none" stroke="#5f9e30" stroke-width="1.4" opacity="0.5"/>
  <g filter="url(#ss)">
    <g transform="translate(60 82)">
      <ellipse cx="0" cy="34" rx="34" ry="7" fill="#5e3a1c" opacity="0.2"/>
      <!-- legs -->
      <rect x="-16" y="20" width="6" height="16" rx="3" fill="#4a4e56"/>
      <rect x="10" y="20" width="6" height="16" rx="3" fill="#4a4e56"/>
      <!-- fluffy wool body: cluster of bumps -->
      <g fill="url(#swool)" stroke="#cdbf9f" stroke-width="0.8">
        <circle cx="-22" cy="-2" r="13"/>
        <circle cx="-8" cy="-14" r="14"/>
        <circle cx="10" cy="-13" r="14"/>
        <circle cx="24" cy="-2" r="13"/>
        <circle cx="-14" cy="8" r="13"/>
        <circle cx="2" cy="12" r="14"/>
        <circle cx="18" cy="8" r="13"/>
        <circle cx="2" cy="-2" r="15"/>
      </g>
      <!-- head -->
      <g transform="translate(28 -10)">
        <ellipse cx="6" cy="2" rx="11" ry="13" fill="url(#sface)" stroke="#2e3138" stroke-width="1"/>
        <ellipse cx="2" cy="14" rx="6" ry="4.5" fill="#54585f"/>
        <ellipse cx="-4" cy="-4" rx="4" ry="7" fill="#3f434b" transform="rotate(-25 -4 -4)"/>
        <ellipse cx="14" cy="-3" rx="4" ry="7" fill="#4a4e56" transform="rotate(20 14 -3)"/>
        <circle cx="2" cy="2" r="1.7" fill="#1a1c20"/>
        <circle cx="9" cy="2" r="1.7" fill="#1a1c20"/>
        <circle cx="2.6" cy="1.4" r="0.6" fill="#fff"/>
        <circle cx="9.6" cy="1.4" r="0.6" fill="#fff"/>
      </g>
    </g>
  </g>
  <rect x="32" y="130" width="56" height="20" rx="6" fill="#4d8226"/>
  <rect x="32" y="130" width="56" height="20" rx="6" fill="none" stroke="#365e18" stroke-width="1"/>
  <text x="60" y="144.5" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#f3e6c8">WOOL</text>
</svg>
