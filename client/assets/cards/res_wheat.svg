<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <linearGradient id="hf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c863"/>
      <stop offset="1" stop-color="#b8841f"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efd6"/>
      <stop offset="1" stop-color="#ead9b3"/>
    </linearGradient>
    <linearGradient id="hgrain" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f4cf6e"/>
      <stop offset="0.6" stop-color="#e3b23c"/>
      <stop offset="1" stop-color="#b07e1c"/>
    </linearGradient>
    <filter id="hs" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.7" dy="1.6" stdDeviation="1.4" flood-color="#2a1c0e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="160" rx="13" fill="#3a2a18"/>
  <rect x="5.5" y="5.5" width="109" height="157" rx="12" fill="url(#hf)"/>
  <rect x="12" y="12" width="96" height="144" rx="8" fill="#3a2a18" opacity="0.35"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="url(#hp)"/>
  <rect x="12.5" y="12.5" width="95" height="143" rx="8" fill="none" stroke="#b8841f" stroke-width="1.4" opacity="0.5"/>
  <g filter="url(#hs)">
    <g transform="translate(60 80)" stroke="#9a6c18" stroke-width="0.7">
      <!-- center stalk grains -->
      <g transform="translate(0 0)">
        <line x1="0" y1="50" x2="0" y2="-30" stroke="#a8761c" stroke-width="2.2"/>
        <g fill="url(#hgrain)">
          <ellipse cx="0" cy="-38" rx="4" ry="9"/>
          <ellipse cx="-6" cy="-30" rx="3.6" ry="8" transform="rotate(-28 -6 -30)"/>
          <ellipse cx="6" cy="-30" rx="3.6" ry="8" transform="rotate(28 6 -30)"/>
          <ellipse cx="-7" cy="-19" rx="3.6" ry="8" transform="rotate(-30 -7 -19)"/>
          <ellipse cx="7" cy="-19" rx="3.6" ry="8" transform="rotate(30 7 -19)"/>
          <ellipse cx="-7" cy="-8" rx="3.6" ry="8" transform="rotate(-32 -7 -8)"/>
          <ellipse cx="7" cy="-8" rx="3.6" ry="8" transform="rotate(32 7 -8)"/>
        </g>
      </g>
      <!-- left stalk -->
      <g transform="translate(-16 6) rotate(-16)">
        <line x1="0" y1="44" x2="0" y2="-22" stroke="#a8761c" stroke-width="2"/>
        <g fill="url(#hgrain)">
          <ellipse cx="0" cy="-30" rx="3.6" ry="8"/>
          <ellipse cx="-5.5" cy="-22" rx="3.2" ry="7" transform="rotate(-28 -5.5 -22)"/>
          <ellipse cx="5.5" cy="-22" rx="3.2" ry="7" transform="rotate(28 5.5 -22)"/>
          <ellipse cx="-6" cy="-12" rx="3.2" ry="7" transform="rotate(-30 -6 -12)"/>
          <ellipse cx="6" cy="-12" rx="3.2" ry="7" transform="rotate(30 6 -12)"/>
        </g>
      </g>
      <!-- right stalk -->
      <g transform="translate(16 6) rotate(16)">
        <line x1="0" y1="44" x2="0" y2="-22" stroke="#a8761c" stroke-width="2"/>
        <g fill="url(#hgrain)">
          <ellipse cx="0" cy="-30" rx="3.6" ry="8"/>
          <ellipse cx="-5.5" cy="-22" rx="3.2" ry="7" transform="rotate(-28 -5.5 -22)"/>
          <ellipse cx="5.5" cy="-22" rx="3.2" ry="7" transform="rotate(28 5.5 -22)"/>
          <ellipse cx="-6" cy="-12" rx="3.2" ry="7" transform="rotate(-30 -6 -12)"/>
          <ellipse cx="6" cy="-12" rx="3.2" ry="7" transform="rotate(30 6 -12)"/>
        </g>
      </g>
      <!-- binding twine -->
      <rect x="-11" y="30" width="22" height="9" rx="3" fill="#9a6c18" stroke="#7a5512" stroke-width="0.8"/>
      <rect x="-11" y="33" width="22" height="2" fill="#c79a3a" stroke="none"/>
    </g>
  </g>
  <rect x="32" y="130" width="56" height="20" rx="6" fill="#a8761c"/>
  <rect x="32" y="130" width="56" height="20" rx="6" fill="none" stroke="#7a5512" stroke-width="1"/>
  <text x="60" y="144.5" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#f3e6c8">GRAIN</text>
</svg>
