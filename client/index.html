<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HEXARA — Island Settlers</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/assets/ui/logo.svg" type="image/svg+xml" />
</head>
<body>
  <!-- ============================ JOIN SCREEN ============================ -->
  <section id="screen-join" class="screen">
    <div class="join-card">
      <img class="join-logo" src="/assets/ui/logo.svg" alt="HEXARA — Island Settlers"
           onerror="this.replaceWith(Object.assign(document.createElement('h1'),{className:'logo-fallback',textContent:'HEXARA — Island Settlers'}))" />
      <p class="join-tag">Settle the island. Trade, build, and outwit your rivals.</p>
      <form id="join-form" autocomplete="off">
        <label class="field">
          <span>Your name</span>
          <input id="join-name" type="text" maxlength="16" placeholder="Settler" required />
        </label>
        <label class="field">
          <span>Room code <em>(blank = create a new game)</em></span>
          <input id="join-room" type="text" maxlength="8" placeholder="ABCD"
                 style="text-transform:uppercase" />
        </label>
        <label class="field" id="join-pass-field" hidden>
          <span>Access code</span>
          <input id="join-pass" type="password" maxlength="64" placeholder="Required for this server" />
        </label>
        <button id="join-btn" type="submit" class="btn btn-primary btn-big">Join / Create Game</button>
        <p id="join-error" class="form-error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- ============================ LOBBY SCREEN ============================ -->
  <section id="screen-lobby" class="screen" hidden>
    <div class="lobby-card">
      <img class="lobby-logo" src="/assets/ui/logo.svg" alt="HEXARA"
           onerror="this.replaceWith(Object.assign(document.createElement('h1'),{className:'logo-fallback',textContent:'HEXARA'}))" />
      <div class="lobby-code-row">
        <span class="lobby-code-label">ROOM CODE</span>
        <span id="lobby-code" class="lobby-code">----</span>
        <button id="lobby-copy" class="btn btn-ghost" title="Copy code">Copy</button>
      </div>

      <div class="lobby-cols">
        <div class="lobby-players-col">
          <h2>Players</h2>
          <ul id="lobby-players" class="lobby-players"></ul>
        </div>
        <div class="lobby-settings-col">
          <h2>You</h2>
          <label class="field">
            <span>Name</span>
            <input id="lobby-name" type="text" maxlength="16" />
          </label>
          <div class="field">
            <span>Colour</span>
            <div id="lobby-palette" class="palette"></div>
          </div>
        </div>
      </div>

      <!-- Game setup: map + rules (host edits; others see a read-only summary) -->
      <div class="lobby-setup" id="lobby-setup">
        <h2>Game Setup</h2>
        <div class="setup-host" id="setup-host">
          <div class="setup-grid">
            <label class="field setup-wide">
              <span>Map</span>
              <select id="setup-preset"></select>
            </label>
            <label class="field" id="setup-size-field" hidden>
              <span>Board size <em>(radius 1–5)</em></span>
              <input id="setup-size" type="number" min="1" max="5" step="1" />
            </label>
            <label class="field"><span>Victory points</span><input id="setup-victoryPoints" type="number" /></label>
            <label class="field"><span>Discard limit <em>(cards)</em></span><input id="setup-discardThreshold" type="number" /></label>
            <label class="field"><span>Max roads</span><input id="setup-maxRoads" type="number" /></label>
            <label class="field"><span>Max settlements</span><input id="setup-maxSettlements" type="number" /></label>
            <label class="field"><span>Max cities</span><input id="setup-maxCities" type="number" /></label>
            <label class="field"><span>Bank / resource</span><input id="setup-bankPerResource" type="number" /></label>
          </div>
          <div class="setup-map-row">
            <button id="setup-edit-map" class="btn">Open Map Editor…</button>
            <span id="setup-map-summary" class="setup-summary"></span>
          </div>
          <p id="setup-error" class="form-error"></p>
        </div>
        <p id="setup-readonly" class="setup-summary" hidden></p>
      </div>

      <div class="lobby-actions">
        <div id="lobby-host-controls" class="host-controls">
          <button id="lobby-add-bot" class="btn">+ Add Bot</button>
          <button id="lobby-start" class="btn btn-primary">Start Game</button>
        </div>
        <button id="lobby-leave" class="btn btn-danger">Leave</button>
      </div>
      <p id="lobby-hint" class="lobby-hint"></p>
    </div>
  </section>

  <!-- ============================ GAME SCREEN ============================ -->
  <section id="screen-game" class="screen game" hidden>
    <!-- Top bar -->
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <img class="topbar-logo" src="/assets/ui/logo.svg" alt="HEXARA"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-fallback-sm',textContent:'HEXARA'}))" />
      </div>
      <div id="turn-indicator" class="turn-indicator">
        <span class="turn-swatch"></span>
        <span class="turn-text">Waiting…</span>
      </div>
      <div class="topbar-dice">
        <img id="die-0" class="die" alt="die" />
        <img id="die-1" class="die" alt="die" />
      </div>
      <div id="topbar-stats" class="topbar-stats">
        <div class="stat-group" id="bank-counts" title="Bank supply"></div>
        <div class="stat-pill" id="dev-deck" title="Development cards left">
          <img src="/assets/cards/dev_back.svg" class="stat-ico" alt="dev"
               onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'stat-ico-fb',textContent:'D'}))" />
          <span class="stat-val">–</span>
        </div>
        <div class="stat-pill" id="award-road" title="Longest Road">
          <span class="award-ico">🛣</span><span class="stat-val">–</span>
        </div>
        <div class="stat-pill" id="award-army" title="Largest Army">
          <span class="award-ico">⚔</span><span class="stat-val">–</span>
        </div>
      </div>
    </header>

    <!-- Main 3-column layout -->
    <div class="game-body">
      <!-- Left: players panel -->
      <aside id="players-panel" class="panel players-panel"></aside>

      <!-- Center: board + action bar + log -->
      <main class="board-area">
        <div id="board-wrap" class="board-wrap">
          <canvas id="board-canvas"></canvas>
          <div id="mode-banner" class="mode-banner" hidden></div>
        </div>
        <div id="action-bar" class="action-bar"></div>
      </main>

      <!-- Right: your hand + log -->
      <aside id="side-panel" class="panel side-panel">
        <div id="hand-panel" class="hand-panel"></div>
        <div class="log-panel">
          <h3>Game Log</h3>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- Modal host + toasts (top-level so they overlay any screen, incl. the lobby) -->
  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast-area" class="toast-area"></div>

  <!-- Scripts in dependency order -->
  <script src="/js/net.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
